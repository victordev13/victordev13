name: Update profile metrics

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: victordev13/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master (fork of lowlighter/metrics)
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: victordev13
          template: classic
          base: header, activity, community
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
