name: Update profile metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34 (uses maintained prebuilt image, avoids local Docker build)
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: victordev13
          template: classic
          base: header, activity, community
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
